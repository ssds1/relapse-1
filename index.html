<head>

<style>
:root {
  --bg-main: #07090f;
  --bg-card: #0e1320;
  --bg-card-hover: #151d30;
  --accent: #00d2ff;
  --accent-soft: rgba(0, 210, 255, 0.16);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-accent: rgba(0, 210, 255, 0.45);
  --text-primary: #f4f7fb;
  --text-secondary: #9aa7bd;
  --text-muted: #5e6b82;
  font-size: 17px;
}

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--bg-main);
  background-image:
    radial-gradient(circle at 50% -10%, rgba(0, 210, 255, 0.16), transparent 55%),
    linear-gradient(180deg, #090d16 0%, #05070c 100%);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  display: grid;
  grid-template-rows: auto 1fr auto;
}

a {
  color: var(--text-primary);
  text-decoration: none;
}

a:active, a:focus {
  outline: 0;
}

.p-2 {
  padding: 2rem 1rem 0.5rem !important;
  text-align: center;
}

h1.text-center {
  margin: 0;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 0.6px;
  color: var(--text-primary);
}

#top-bar-text {
  margin: 0.7rem auto 0;
  display: inline-block;
  padding: 0.35rem 1rem;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.88rem;
}

.fw-bold {
  font-weight: 800;
}

#current-fw {
  color: var(--accent);
}

.text-center {
  text-align: center;
}

#main-content {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

#main-content > div {
  position: relative;
  width: 100%;
  max-width: 440px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

#pre-jb-view {
  display: flex !important;
  flex-direction: column;
  gap: 0.85rem;
  padding: 1.6rem;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
}

.btn {
  display: block;
  width: 100%;
  padding: 1rem 1.5rem;
  border-radius: 14px;
  background: var(--bg-card-hover);
  border: 1px solid var(--border-accent);
  color: var(--text-primary);
  font-size: 1.2rem;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.btn:hover, .btn:focus {
  background: var(--accent);
  border-color: var(--accent);
  color: #05070c;
  transform: translateY(-2px);
}
