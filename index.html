<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Relapse (dev)</title>
<style>
:root {
  --bg-main: #07090f;
  --bg-card: #0e1320;
  --bg-card-hover: #172036;
  --accent: #00d2ff;
  --border-subtle: rgba(255, 255, 255, 0.1);
  --border-accent: rgba(0, 210, 255, 0.5);
  --text-primary: #f4f7fb;
  --text-secondary: #9aa7bd;
  --text-muted: #5e6b82;
  font-size: 16px;
}

* {
  box-sizing: border-box;
}

html, body {
  min-height: 100vh;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--bg-main);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.18), transparent 55%),
    linear-gradient(180deg, #090d16 0%, #05070c 100%);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 14px 20px;
  gap: 16px;
}

a {
  color: var(--text-primary);
  text-decoration: none;
}

a:active, a:focus {
  outline: 0;
}

.p-2 {
  text-align: center;
  padding-top: 8px;
}

h1.text-center {
  margin: 0;
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--text-primary);
}

#top-bar-text {
  margin: 10px auto 0;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.88rem;
}

.fw-bold {
  font-weight: 800;
}

#current-fw {
  color: var(--accent);
}

.text-center {
  text-align: center;
}

#main-content {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto 0;
}

#main-content > div {
  width: 100%;
  max-width: 430px;
}

#pre-jb-view {
  display: flex !important;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  border-radius: 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
}

.btn {
  display: block;
  width: 100%;
  padding: 15px 20px;
  border-radius: 12px;
  background: var(--bg-card-hover);
  border: 1px solid var(--border-accent);
  color: var(--text-primary);
  font-size: 1.15rem;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn:hover, .btn:focus {
  background: var(--accent);
  border-color: var(--accent);
  color: #05070c;
}

.btn-secondary {
  padding: 12px 18px;
  font-size: 0.98rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

.btn-secondary:hover, .btn-secondary:focus {
  background: #e6ecf5;
  border-color: #e6ecf5;
  color: #090d16;
}

.selected {
  opacity: 1 !important;
  pointer-events: auto !important;
}

#credits {
  text-align: center;
  padding: 6px 8px 0;
  pointer-events: none;
}

#credits span {
  display: block;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

#credits h3 {
  margin: 0 auto;
  max-width: 60rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  line-height: 1.45;
}

#basedon {
  margin: 6px 0 0;
  font-size: 0.68rem;
  color: #455066;
}
</style>
</head>

  </div>
