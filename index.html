<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Relapse (dev)</title>
<style>
:root {
  --text-color-primary: #f8fafc;
  --text-color-secondary: #cbd5e1;
  --text-color-tertiary: #94a3b8;
  --background-color-primary: #04070e;
  --surface-color-primary: #0d1526;
  --surface-color-secondary: #080d18;
  --surface-color-hover: #00f0ff;
  --text-color-primary-hover: #04070e;
  --text-color-secondary-hover: #04070e;
  --accent-border: rgba(0, 240, 255, 0.4);
  font-size: 17px;
}

* {
  box-sizing: border-box;
}

body {
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--background-color-primary);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.16), transparent 55%),
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
  color: var(--text-color-primary);
  font-family: Arial, sans-serif;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  padding: 0;
  margin: 0;
  overflow: hidden;
}

a {
  color: var(--text-color-primary);
}
a:active, a:focus {
  outline: 0;
  border: none;
}

.btn {
  padding: 1rem 2rem;
  text-align: center;
  text-decoration: none;
  display: block;
  margin: 0.65rem auto;
  cursor: pointer;
  line-height: 2.2rem;
  min-width: 5rem;
  border-radius: 10px;
  width: 75%;
  max-width: 420px;
  background-color: var(--surface-color-primary);
  border: 1px solid var(--accent-border);
  border-left: 4px solid var(--surface-color-hover);
  color: var(--text-color-primary);
  font-size: 1.25rem;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn:hover, .btn:focus {
  background-color: var(--surface-color-hover);
  border-color: var(--surface-color-hover);
  color: var(--text-color-primary-hover);
}

.btn-secondary {
  padding: 0.75rem 1.8rem;
  font-size: 1rem;
  background-color: var(--surface-color-secondary);
  border-color: rgba(255, 184, 0, 0.35);
  border-left: 4px solid #ffb800;
  color: var(--text-color-secondary);
}

.btn-secondary:hover, .btn-secondary:focus {
  background-color: #ffb800;
  border-color: #ffb800;
  color: var(--text-color-secondary-hover);
}

#main-content {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

#main-content > div {
  width: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease-in-out;
}

#pre-jb-view {
  display: block !important;
  text-align: center;
  width: 100%;
}

.selected {
  opacity: 1 !important;
  pointer-events: auto !important;
}

.text-center { text-align: center; }
.fw-bold { font-weight: 800; }
.p-2 { padding: 1.5rem 1rem 0.5rem !important; }

#top-bar-text {
  display: inline-block;
  margin: 0.6rem auto 0;
  padding: 0.3rem 0.95rem;
  border-radius: 6px;
  background-color: rgba(13, 21, 38, 0.9);
  border: 1px solid rgba(0, 240, 255, 0.28);
  color: var(--text-color-secondary);
  font-size: 0.85rem;
}

#current-fw {
  color: #00f0ff;
}

#credits {
  text-align: center;
  padding: 0 16px 14px;
  pointer-events: none;
}

#credits span {
  display: block;
  color: #00f0ff;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  margin-bottom: 5px;
  opacity: 0.85;
}

#credits h3 {
  margin: 0 auto;
  max-width: 60rem;
  font-size: 0.78rem;
  font-weight: 700;
  color: #64748b;
  line-height: 1.5;
}

#basedon {
  margin: 8px 0 0;
  font-size: 0.68rem;
  color: #475569;
  letter-spacing: 0.05em;
  font-weight: 400;
}
</style>
</head>
<body>
  <div class="p-2">
    <h1 class="text-center">Relapse dev (7.00 - 13.60)</h1>
    <p class="text-center" id="top-bar-text">Current Firmware: <span class="fw-bold" id="current-fw">Unknown</span></p
