<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Relapse (dev)</title>
<style>
:root {
  --hud-bg: #05070e;
  --hud-panel: rgba(11, 16, 30, 0.92);
  --hud-cyan: #00f0ff;
  --hud-purple: #a855f7;
  --hud-border: rgba(0, 240, 255, 0.35);
  --hud-text: #f8fafc;
  --hud-muted: #94a3b8;
  font-size: 17px;
}

* {
  box-sizing: border-box;
}

body {
  user-select: none;
  -webkit-user-select: none;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  color: var(--hud-text);
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: var(--hud-bg);
  background-image:
    linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
    radial-gradient(circle at 50% -10%, rgba(0, 240, 255, 0.2), transparent 55%),
    radial-gradient(circle at 50% 110%, rgba(168, 85, 247, 0.14), transparent 55%);
  background-size: 36px 36px, 36px 36px, 100% 100%, 100% 100%;
}

a {
  color: var(--hud-text);
  text-decoration: none;
}

a:active, a:focus {
  outline: 0;
}

.p-2 {
  padding: 1.5rem 1rem 0.5rem !important;
  text-align: center;
}

h1.text-center {
  margin: 0;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--hud-text);
  text-shadow: 0 0 18px rgba(0, 240, 255, 0.28);
}

#top-bar-text {
  display: inline-block;
  margin: 0.65rem auto 0;
  padding: 0.35rem 1rem;
  border-radius: 6px;
  background-color: var(--hud-panel);
  border: 1px solid var(--hud-border);
  border-left: 3px solid var(--hud-cyan);
