<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Relapse (dev)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg-core: #030407;
  --surface-glass: rgba(13, 17, 28, 0.75);
  --border-glow: rgba(0, 243, 255, 0.3);
  --neon-cyan: #00f3ff;
  --neon-purple: #b000ff;
  --text-main: #ffffff;
  --text-muted: #8b9bb4;
  font-size: 16px;
}

* {
  box-sizing: border-box;
}

body {
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--bg-core);
  background-image: 
    radial-gradient(circle at 50% -20%, rgba(0, 243, 255, 0.18) 0%, transparent 60%),
    radial-gradient(circle at 50% 120%, rgba(176, 0, 255, 0.15) 0%, transparent 60%),
    linear-gradient(180deg, #070913 0%, #030407 100%);
  color: var(--text-main);
  font-family: 'Outfit', sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  height: 100vh;
  padding: 0;
  margin: 0;
  overflow: hidden;
  position: relative;
}

/* خلفية شبكية سايبربانك خفيفة وعميقة */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

a {
  color: var(--text-main);
  text-decoration: none;
}

a:active, a:focus {
  outline: 0;
}

/* الهيدر العلوي */
.p-2 {
  padding: 2.5rem 1rem 1rem !important;
  z-index: 2;
  width: 100%;
  text-align: center;
}

h1.text-center {
  margin: 0;
  font-size: 2.4rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: linear-gradient(135deg, #ffffff 40%, var(--neon-cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.35));
}

#top-bar-text {
  margin: 0.85rem auto 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0.4rem 1.25rem;
  background: rgba(13, 17, 28, 0.85);
  border: 1px solid var(--border-glow);
  border-radius: 999px;
  font-size: 0.85rem;
  color: var(--text-muted);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 243, 255, 0.1);
  font-family: 'JetBrains Mono', monospace;
}

#current-fw {
  color: var(--neon-cyan);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
}

/* منطقة الأزرار في المنتصف داخل إطار زجاجي فاخر */
#main-content {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

#main-content > div {
  position: absolute;
  width: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease-in-out;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#pre-jb-view {
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 90%;
  max-width: 420px;
  padding: 2.2rem 1.8rem;
  background: var(--surface-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-left: 3px solid var(--neon-cyan);
  border-radius: 20px;
  box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 243, 255, 0.1);
  gap: 1.1rem;
}

.btn {

  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 12px;
  width: 100%;
  background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(13, 17, 28, 0.9) 100%);
  border: 1px solid rgba(0, 243, 255, 0.35);
  color: #ffffff;
  font-size: 1.2rem;
  font-weight: 7
